<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#bgGrad2)" />
  
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <line x1="0" y1="75" x2="600" y2="75" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="225" x2="600" y2="225" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="375" x2="600" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
  </g>

  <!-- Clinic Center Diagnostic Silhouette -->
  <g transform="translate(150, 75)">
    <rect x="0" y="25" width="300" height="225" rx="20" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Modern Tech Medical Emblem -->
    <circle cx="150" cy="80" r="38" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <circle cx="150" cy="80" r="28" fill="#ffffff" />
    
    <!-- Heart & Stethoscope / Cross Combo -->
    <path d="M 143 62 L 157 62 L 157 73 L 168 73 L 168 87 L 157 87 L 157 98 L 143 98 L 143 87 L 132 87 L 132 73 L 143 73 Z" fill="#0284c7" />
    
    <!-- Lab / Diagnostic Clinic Windows -->
    <rect x="35" y="135" width="60" height="42" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="205" y="135" width="60" height="42" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Automatic Glass Entrance Doors -->
    <rect x="120" y="135" width="60" height="115" rx="10" fill="#ffffff" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    <line x1="150" y1="135" x2="150" y2="250" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(300, 360)" text-anchor="middle">
    <rect x="-150" y="-20" width="300" height="36" rx="18" fill="#ffffff" fill-opacity="0.95" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" letter-spacing="1">
      🔬 LABORATORIUM &amp; DIAGNOSTIKA
    </text>
  </g>

  <text x="300" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#bae6fd" font-weight="500">
    Layanan Pemeriksaan Fisik, Antropometri &amp; Rujukan
  </text>
</svg>
