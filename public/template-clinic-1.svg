<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background with subtle medical grid -->
  <rect width="600" height="450" fill="url(#bgGrad1)" />
  
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="75" x2="600" y2="75" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="225" x2="600" y2="225" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="375" x2="600" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
  </g>

  <!-- Clinic Architectural Silhouette -->
  <g transform="translate(150, 80)">
    <!-- Base building card -->
    <rect x="0" y="20" width="300" height="230" rx="20" fill="url(#cardGrad1)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Roof Header -->
    <path d="M 30 20 L 150 -10 L 270 20 Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Medical Cross Emblem -->
    <circle cx="150" cy="80" r="36" fill="#ffffff" />
    <path d="M 142 58 L 158 58 L 158 72 L 172 72 L 172 88 L 158 88 L 158 102 L 142 102 L 142 88 L 128 88 L 128 72 L 142 72 Z" fill="#047857" />
    
    <!-- Clinic Windows & Entrance -->
    <rect x="40" y="140" width="55" height="40" rx="8" fill="#ffffff" fill-opacity="0.25" />
    <rect x="205" y="140" width="55" height="40" rx="8" fill="#ffffff" fill-opacity="0.25" />
    
    <!-- Main Entrance Door -->
    <rect x="125" y="140" width="50" height="110" rx="10" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="150" y1="140" x2="150" y2="250" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="143" cy="195" r="3" fill="#ffffff" />
    <circle cx="157" cy="195" r="3" fill="#ffffff" />
  </g>

  <!-- Typography & Badge -->
  <g transform="translate(300, 360)" text-anchor="middle">
    <rect x="-140" y="-20" width="280" height="36" rx="18" fill="#ffffff" fill-opacity="0.95" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#065f46" letter-spacing="1">
      🏥 FASILITAS KESEHATAN RESMI
    </text>
  </g>

  <!-- Accreditation Subtitle -->
  <text x="300" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a7f3d0" font-weight="500">
    Klinik Pratama &amp; Rujukan Terakreditasi Kemenkes RI
  </text>
</svg>
