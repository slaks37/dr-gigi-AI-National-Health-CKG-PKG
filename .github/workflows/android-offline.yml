name: Android offline research APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/android/**
      - src/clinical-engine/terminology/**
      - .github/workflows/android-offline.yml
permissions:
  contents: read
concurrency:
  group: sonri-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify generated local terminology
        run: node --import tsx apps/android/scripts/export-terminology.ts --check
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build installable debug APK and test APK; run Kotlin tests and lint
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Inspect actual APK permissions, assets and native alignment
        run: >-
          python3 apps/android/scripts/verify_apk.py
          --apk apps/android/app/build/outputs/apk/debug/app-debug.apk
          --manifest apps/android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          --output apps/android/evidence/local/apk-static.json
      - name: Enable runner KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual AOSP emulator software acceptance (no dental weights)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            python3 apps/android/scripts/device_test.py --serial emulator-5554
            --setup-emulator
            --apk apps/android/app/build/outputs/apk/debug/app-debug.apk
            --test-apk apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            --output apps/android/evidence/local/emulator
      - name: APK checksum
        if: always()
        run: |
          mkdir -p apps/android/evidence/local
          if test -f apps/android/app/build/outputs/apk/debug/app-debug.apk; then
            sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk > apps/android/evidence/local/SHA256SUMS.txt
          fi
      - name: Publish research APK and synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonri-android-research-debug
          retention-days: 14
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/evidence/local/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
